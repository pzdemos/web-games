<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2048 · 小游戏</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23f65e3b'/%3E%3Ctext x='50' y='52' font-size='40' font-weight='800' fill='%23fff' font-family='Arial' text-anchor='middle' dominant-baseline='central'%3E2048%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div class="orbs" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="top">
    <div class="title">2048</div>
    <div class="scores">
      <div class="score-box"><div class="label">Score</div><div class="val" id="score">0</div></div>
      <div class="score-box"><div class="label">Best</div><div class="val" id="best">0</div></div>
    </div>
  </div>
  <div class="bar">
    <div class="hint">方向键 / <b>WASD</b> / 滑动 移动方块</div>
    <button id="newBtn" class="ghost">新游戏</button>
  </div>
  <div class="wrap">
    <div class="board" id="board"></div>
    <div class="tiles" id="tiles"></div>
    <div class="overlay" id="overlay">
      <div class="confetti" id="confetti"></div>
      <h2 id="ovTitle">游戏结束</h2>
      <p id="ovText">得分 0</p>
      <button id="ovBtn">再来一局</button>
    </div>
  </div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
