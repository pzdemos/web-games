<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏厅 · 好爱干饭</title>
<style>
:root {
  --bg: #0b0a10;
  --glass: rgba(255,255,255,.04); --glass2: rgba(255,255,255,.07);
  --stroke: rgba(255,255,255,.08); --stroke2: rgba(255,255,255,.16);
  --text: #f4f1ea; --muted: #a39d92; --dim: #6b665e;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden;
  font-family: "SF Pro Display", -apple-system, "PingFang SC", "HarmonyOS Sans", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}
/* ---------- ambient ---------- */
.ambient { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.glow-top { position: absolute; left: 50%; top: -32vmax; width: 90vmax; height: 60vmax; transform: translateX(-50%);
  background: radial-gradient(ellipse at center, rgba(255,190,130,.09), transparent 62%); }
.glow-bl { position: absolute; left: -16vmax; bottom: -20vmax; width: 52vmax; height: 52vmax; border-radius: 50%;
  background: radial-gradient(circle, rgba(140,190,170,.06), transparent 65%); animation: d1 30s ease-in-out infinite alternate; }
.glow-br { position: absolute; right: -18vmax; bottom: -8vmax; width: 46vmax; height: 46vmax; border-radius: 50%;
  background: radial-gradient(circle, rgba(220,160,150,.05), transparent 65%); animation: d2 36s ease-in-out infinite alternate; }
@keyframes d1 { to { transform: translate(6vmax, -4vmax); } }
@keyframes d2 { to { transform: translate(-5vmax, -6vmax); } }
.gridlines { position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image: linear-gradient(rgba(244,241,234,.022) 1px, transparent 1px), linear-gradient(90deg, rgba(244,241,234,.022) 1px, transparent 1px);
  background-size: 52px 52px;
  mask-image: radial-gradient(ellipse 90% 70% at 50% 18%, #000 25%, transparent 75%);
  -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 18%, #000 25%, transparent 75%);
}

main { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; padding: 0 24px 56px; }

/* ---------- hero ---------- */
.hero { text-align: center; padding: 88px 10px 34px; }
.hero .pill {
  display: inline-flex; align-items: center; gap: 9px; font-size: 12px; letter-spacing: 3px;
  color: var(--muted); border: 1px solid var(--stroke); background: var(--glass);
  border-radius: 999px; padding: 8px 18px; margin-bottom: 26px; backdrop-filter: blur(12px);
  opacity: 0; animation: rise .8s cubic-bezier(.2,.9,.3,1) .1s forwards;
}
.hero .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: #e8c491; box-shadow: 0 0 9px #e8c491; animation: pu 2.4s infinite; }
@keyframes pu { 50% { opacity: .35; } }
.hero h1 {
  font-size: clamp(46px, 8vw, 88px); font-weight: 900; line-height: 1.08; letter-spacing: 2px;
  opacity: 0; animation: rise .9s cubic-bezier(.2,.9,.3,1) .25s forwards;
}
.hero h1 .grad {
  background: linear-gradient(100deg, #f6e7c8 8%, #ecc896 38%, #dfa878 68%, #c99a9a 100%);
  background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: shimmer 9s linear infinite;
}
@keyframes shimmer { to { background-position: 200% center; } }
.hero p.sub {
  color: var(--muted); font-size: 15px; margin-top: 18px; letter-spacing: 2px;
  opacity: 0; animation: rise .9s cubic-bezier(.2,.9,.3,1) .4s forwards;
}
.hero p.sub b { color: #e2bd8b; font-weight: 600; }
.hero .stats-line {
  display: flex; justify-content: center; gap: 44px; margin-top: 34px; flex-wrap: wrap;
  opacity: 0; animation: rise .9s cubic-bezier(.2,.9,.3,1) .55s forwards;
}
.hero .stats-line div { text-align: center; }
.hero .stats-line b { display: block; font-size: 27px; font-weight: 800; font-variant-numeric: tabular-nums;
  background: linear-gradient(180deg, #f7f3ea, #b5ad9d); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero .stats-line span { font-size: 11px; letter-spacing: 3px; color: var(--dim); }
@keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }

/* ---------- section ---------- */
.section-title {
  display: flex; align-items: center; gap: 14px; margin: 48px 4px 20px;
  opacity: 0; animation: rise .8s ease .7s forwards;
}
.section-title h2 { font-size: 19px; font-weight: 800; letter-spacing: 1.5px; }
.section-title .line { flex: 1; height: 1px; background: linear-gradient(90deg, var(--stroke2), transparent); }
.section-title .tag { font-size: 11px; color: var(--dim); letter-spacing: 3px; }

/* ---------- game cards ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; perspective: 1400px; }
.card {
  position: relative; border-radius: 22px; padding: 22px; cursor: pointer; text-decoration: none; color: inherit;
  background: linear-gradient(165deg, var(--glass2), var(--glass));
  border: 1px solid var(--stroke); backdrop-filter: blur(14px);
  display: flex; gap: 17px; align-items: flex-start;
  transform-style: preserve-3d; will-change: transform;
  transition: border-color .35s, box-shadow .35s;
  opacity: 0; transform: translateY(30px);
  animation: cardIn .7s cubic-bezier(.2,.9,.3,1) forwards;
}
@keyframes cardIn { to { opacity: 1; transform: translateY(0); } }
.card:hover { border-color: color-mix(in srgb, var(--c1) 40%, transparent); box-shadow: 0 26px 64px rgba(0,0,0,.45), 0 0 42px -18px var(--c1); }
.card .glare { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity .3s;
  background: radial-gradient(420px circle at var(--mx,50%) var(--my,50%), rgba(255,250,240,.07), transparent 45%); }
.card:hover .glare { opacity: 1; }
.card .icon {
  flex: 0 0 58px; height: 58px; border-radius: 18px; display: grid; place-items: center;
  position: relative; overflow: hidden;
  background: linear-gradient(140deg, var(--c1), var(--c2));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 10px 26px -8px color-mix(in srgb, var(--c1) 55%, transparent);
  transition: transform .35s cubic-bezier(.34,1.56,.64,1);
}
.card:hover .icon { transform: translateY(-3px) rotate(-6deg) scale(1.08); }
.card .icon::after { content: ''; position: absolute; inset: 0; background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,.4) 50%, transparent 70%);
  transform: translateX(-130%); transition: transform .7s; }
.card:hover .icon::after { transform: translateX(130%); }
.card .icon svg { width: 30px; height: 30px; }
.card .info { flex: 1; min-width: 0; }
.card h3 { font-size: 17px; font-weight: 800; display: flex; align-items: center; gap: 9px; flex-wrap: wrap; letter-spacing: .5px; }
.card h3 .badge { font-size: 9px; font-weight: 700; letter-spacing: 1.5px; padding: 3px 9px; border-radius: 99px;
  background: color-mix(in srgb, var(--c1) 13%, transparent); color: var(--c1); border: 1px solid color-mix(in srgb, var(--c1) 28%, transparent); }
.card .desc { color: var(--muted); font-size: 13px; line-height: 1.7; margin-top: 8px; }
.card .meta { display: flex; gap: 6px; margin-top: 13px; flex-wrap: wrap; }
.card .meta i { font-style: normal; font-size: 11px; color: var(--dim); background: rgba(255,255,255,.03);
  border: 1px solid var(--stroke); border-radius: 7px; padding: 3px 9px; }
.card .meta i.hl { color: var(--c1); border-color: color-mix(in srgb, var(--c1) 30%, transparent); background: color-mix(in srgb, var(--c1) 7%, transparent); }
.card .arrow { position: absolute; right: 18px; bottom: 16px; font-size: 15px; color: var(--dim);
  transition: transform .3s cubic-bezier(.34,1.56,.64,1), color .3s; }
.card:hover .arrow { transform: translateX(6px); color: var(--c1); }

/* ---------- footer ---------- */
footer { text-align: center; padding: 52px 16px 26px; color: var(--dim); font-size: 12px; letter-spacing: 1px; }
footer a { color: var(--muted); text-decoration: none; font-weight: 600; transition: color .25s; }
footer a:hover { color: #e2bd8b; }
footer .brand-mark { color: #e2bd8b; font-weight: 800; letter-spacing: 2px; }
footer .rule { width: 44px; height: 1px; margin: 16px auto; background: linear-gradient(90deg, transparent, var(--stroke2), transparent); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01s !important; transition-duration: .01s !important; }
}
</style>
</head>
<body>
<div class="ambient"><div class="glow-top"></div><div class="glow-bl"></div><div class="glow-br"></div></div>
<div class="gridlines"></div>

<main>
<section class="hero">
  <div class="pill"><span class="dot"></span>ARCADE · 全天候营业</div>
  <h1>好爱干饭<br><span class="grad">游戏厅</span></h1>
  <p class="sub">经典小游戏合集 · 全部<b>免登录直玩</b> · 移动端与键盘双适配</p>
  <div class="stats-line">
    <div><b id="stGames">6</b><span>款游戏</span></div>
    <div><b>∞</b><span>营业时间</span></div>
    <div><b>0</b><span>广告打扰</span></div>
  </div>
</section>

<div class="section-title">
  <h2>全部游戏</h2><span class="tag">ALL GAMES</span><div class="line"></div>
</div>
<div class="grid" id="gameGrid"></div>

<footer>
  <div class="rule"></div>
  <a href="https://www.haoaiganfan.top" target="_blank" rel="noopener"><span class="brand-mark">zhaojiu</span> 出品</a>
  · 用心做点好玩儿的
</footer>
</main>

<script>
const GAMES = [
  { name: '拳皇 KOF', url: 'https://kof.haoaiganfan.top', badge: '格斗',
    desc: 'LF2 真实角色动画 · 6 斗士必杀/超杀 · 连击/防御/气槽 · CPU 三难度 + 同屏双人 + 街机五连战',
    tags: ['格斗', '必杀技', '双人', '街机模式'],
    c1: '#ff8a4a', c2: '#d43a1a',
    icon: `<svg viewBox="0 0 24 24" fill="none" stroke="#3a1004" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M8 11V5.5a1.7 1.7 0 0 1 3.4 0V10"/><path d="M11.4 10V4.3a1.7 1.7 0 0 1 3.4 0V10"/><path d="M14.8 10.5V5.8a1.7 1.7 0 0 1 3.4 0V13c0 4.4-2.6 8-7 8-3.4 0-5-1.9-6.8-5.2l-1.6-3a1.6 1.6 0 0 1 2.7-1.7L8 13.5"/><path d="M17 2.6l.6 1.3 1.4.2-1 1 .2 1.4-1.2-.7" stroke-width="1.6"/></svg>` },
  { name: '推箱子', url: 'https://sokoban.haoaiganfan.top', badge: '57 关',
    desc: 'BFS 验证全部可解的关卡集 · 撤销配额 · 最佳步数 · 云端进度同步',
    tags: ['闯关', '思考', '进度云同步'],
    c1: '#eec49a', c2: '#d99e6a',
    icon: `<svg viewBox="0 0 24 24" fill="none" stroke="#3d2a14" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="12" width="9" height="9" rx="1.5"/><rect x="12" y="3" width="9" height="9" rx="1.5" fill="rgba(61,42,20,.22)"/><circle cx="5" cy="5" r="2" fill="#3d2a14" stroke="none"/></svg>` },
  { name: '2048', url: 'https://2048.haoaiganfan.top', badge: '经典',
    desc: '数字合成 · 键盘触屏双操作 · 云端排行榜(服务端重放验证)',
    tags: ['数字', '益智', '云端排行'],
    c1: '#e8cf9a', c2: '#cba85f',
    icon: `<svg viewBox="0 0 24 24" fill="none" stroke="#3d3014" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 15V9l3 4 3-4v6"/></svg>` },
  { name: '扫雷', url: 'https://mines.haoaiganfan.top', badge: '无猜',
    desc: '棋盘保证逻辑可解 · 推理提示 · 每日挑战 · 双主题战绩',
    tags: ['推理', '每日挑战', '无猜'],
    c1: '#9ecfc0', c2: '#6ba894',
    icon: `<svg viewBox="0 0 24 24" fill="none" stroke="#14302a" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="6.5"/><path d="M12 8.5v7M9.5 10.5l5 3M14.5 10.5l-5 3"/></svg>` },
  { name: '俄罗斯方块', url: 'https://tetris.haoaiganfan.top', badge: '硬核',
    desc: '7 种方块 · 旋转影子硬降 · 云端排行榜(服务端重放验证)',
    tags: ['街机', '反应', '无限模式', '云端排行'],
    c1: '#c3aed6', c2: '#9a82c0',
    icon: `<svg viewBox="0 0 24 24" fill="none" stroke="#2a1f3d" stroke-width="2.2" stroke-linejoin="round"><path d="M5 3h5v5H8v3H5zM14 3h5v5h-2v3h-3zM5 16h3v2h2v3H5zM14 16h3v5h-5v-3h2z"/></svg>` },
  { name: '打砖块', url: 'https://brick.haoaiganfan.top', badge: '多关卡',
    desc: '挡板反弹 · 角度控制 · 鼠标键盘触屏三合一 · 云端排行榜(服务端重放验证)',
    tags: ['街机', '弹球', '多关卡', '云端排行'],
    c1: '#e3aec0', c2: '#c47f9a',
    icon: `<svg viewBox="0 0 24 24" fill="none" stroke="#3d1424" stroke-width="2.2" stroke-linecap="round"><rect x="4" y="4" width="7" height="3.5" rx="1"/><rect x="13" y="4" width="7" height="3.5" rx="1"/><rect x="4" y="9.5" width="7" height="3.5" rx="1"/><rect x="13" y="9.5" width="7" height="3.5" rx="1"/><path d="M4 18h16"/></svg>` },
  { name: '贪吃蛇', url: 'https://snake.haoaiganfan.top', badge: '五速',
    desc: '连击翻倍 · 金色加成 · 五档速度排行 · 云端排行榜(服务端重放验证)',
    tags: ['街机', '生存', '云端排行'],
    c1: '#adc8a0', c2: '#83a873',
    icon: `<svg viewBox="0 0 24 24" fill="none" stroke="#1e3014" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17h6a3 3 0 0 0 0-6H7a3 3 0 0 1 0-6h9"/><circle cx="18.5" cy="5" r="1" fill="#1e3014" stroke="none"/></svg>` },
];

const grid = document.getElementById('gameGrid');
document.getElementById('stGames').textContent = GAMES.length;
GAMES.forEach((g, i) => {
  const a = document.createElement('a');
  a.className = 'card';
  a.href = g.url; a.target = '_blank'; a.rel = 'noopener';
  a.style.animationDelay = (0.75 + i * 0.08) + 's';
  a.style.setProperty('--c1', g.c1); a.style.setProperty('--c2', g.c2);
  a.innerHTML = `
    <div class="glare"></div>
    <div class="icon">${g.icon}</div>
    <div class="info">
      <h3>${g.name}<span class="badge">${g.badge}</span></h3>
      <div class="desc">${g.desc}</div>
      <div class="meta">${g.tags.map((t, j) => `<i class="${j === 0 ? 'hl' : ''}">${t}</i>`).join('')}</div>
    </div>
    <span class="arrow">↗</span>`;
  grid.appendChild(a);
});

/* 3D tilt + glare tracking */
document.querySelectorAll('.card').forEach(card => {
  card.addEventListener('pointermove', e => {
    const r = card.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    card.style.setProperty('--mx', x * 100 + '%');
    card.style.setProperty('--my', y * 100 + '%');
    const rx = (0.5 - y) * 7, ry = (x - 0.5) * 9;
    card.style.transform = `translateY(-4px) rotateX(${rx}deg) rotateY(${ry}deg)`;
  });
  card.addEventListener('pointerleave', () => {
    card.style.transform = '';
    card.style.transition = 'transform .5s cubic-bezier(.2,.9,.3,1), border-color .35s, box-shadow .35s';
    setTimeout(() => card.style.transition = 'border-color .35s, box-shadow .35s', 500);
  });
});
</script>
</body>
</html>
