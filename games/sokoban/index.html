<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>推箱子 · Sokoban Deluxe</title>
<style>
:root {
  --bg0: #0b0e1a; --bg1: #131830; --bg2: #1a2040;
  --glass: rgba(255,255,255,.055); --glass2: rgba(255,255,255,.09);
  --stroke: rgba(255,255,255,.10); --stroke2: rgba(255,255,255,.18);
  --text: #eef1fb; --muted: #9aa2c3; --dim: #616a8f;
  --amber: #ffb454; --amber2: #ff8d3a; --cyan: #53d8ff; --cyan2: #2ea8ff;
  --ok: #4ade9b; --rose: #ff6b8a; --violet: #a78bfa;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  background: var(--bg0); color: var(--text); overflow-x: hidden;
  font-family: "SF Pro Display", -apple-system, "PingFang SC", "HarmonyOS Sans", "Microsoft YaHei", "Segoe UI", sans-serif;
  display: flex; flex-direction: column; align-items: center;
  min-height: 100dvh; user-select: none; touch-action: manipulation;
  -webkit-font-smoothing: antialiased;
}
/* ---------- ambient background ---------- */
.ambient { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .5; will-change: transform; }
.orb.o1 { width: 46vmax; height: 46vmax; left: -12vmax; top: -14vmax;
  background: radial-gradient(circle, #2b3f8f 0%, transparent 65%); animation: drift1 26s ease-in-out infinite alternate; }
.orb.o2 { width: 40vmax; height: 40vmax; right: -10vmax; top: 30%;
  background: radial-gradient(circle, #7a3fb0 0%, transparent 65%); animation: drift2 32s ease-in-out infinite alternate; }
.orb.o3 { width: 34vmax; height: 34vmax; left: 20%; bottom: -16vmax;
  background: radial-gradient(circle, #0f6f8f 0%, transparent 65%); animation: drift3 38s ease-in-out infinite alternate; }
@keyframes drift1 { to { transform: translate(9vmax, 7vmax) scale(1.15); } }
@keyframes drift2 { to { transform: translate(-8vmax, -9vmax) scale(.9); } }
@keyframes drift3 { to { transform: translate(6vmax, -6vmax) scale(1.1); } }
.gridlines { position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image: linear-gradient(rgba(255,255,255,.024) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255,255,255,.024) 1px, transparent 1px);
  background-size: 44px 44px;
  mask-image: radial-gradient(ellipse 90% 70% at 50% 30%, #000 30%, transparent 75%);
  -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 30%, #000 30%, transparent 75%);
}
main { position: relative; z-index: 1; width: 100%; display: flex; flex-direction: column; align-items: center; flex: 1; }

/* ---------- header ---------- */
header {
  width: 100%; max-width: 900px; display: flex; align-items: center; justify-content: space-between;
  padding: 18px 20px 8px; gap: 10px;
}
.logo { display: flex; align-items: center; gap: 12px; }
.logo-mark {
  width: 42px; height: 42px; border-radius: 13px; position: relative;
  background: linear-gradient(135deg, var(--amber) 0%, var(--amber2) 100%);
  box-shadow: 0 4px 24px rgba(255,141,58,.45), inset 0 1px 0 rgba(255,255,255,.4);
  display: grid; place-items: center; animation: markFloat 4s ease-in-out infinite;
}
@keyframes markFloat { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-3px) rotate(2deg); } }
.logo-mark::before { content: ''; width: 16px; height: 16px; border-radius: 4px;
  background: rgba(30,15,0,.75); box-shadow: 0 -10px 0 -6px rgba(30,15,0,.75), 10px 0 0 -6px rgba(30,15,0,.75); }
.logo h1 { font-size: 21px; font-weight: 800; letter-spacing: .5px;
  background: linear-gradient(92deg, #fff 20%, var(--amber) 55%, var(--rose) 90%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  background-size: 200% auto; animation: shimmer 6s linear infinite; }
@keyframes shimmer { to { background-position: 200% center; } }
.logo small { display: block; font-size: 10px; color: var(--dim); letter-spacing: 3px; font-weight: 600; }
.head-right { display: flex; gap: 8px; align-items: center; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--glass); border: 1px solid var(--stroke); border-radius: 999px;
  padding: 6px 13px; font-size: 12px; color: var(--muted); backdrop-filter: blur(14px);
  transition: border-color .3s, color .3s;
}
.chip:hover { border-color: var(--stroke2); color: var(--text); }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); animation: pulse 2s infinite; }
.chip.off .dot { background: var(--dim); box-shadow: none; animation: none; }
@keyframes pulse { 50% { opacity: .4; } }
#lvBadge { color: var(--text); font-weight: 700; font-size: 13px; }

/* ---------- HUD ---------- */
.hud { display: flex; gap: 10px; padding: 12px 16px 6px; flex-wrap: wrap; justify-content: center; }
.stat {
  min-width: 92px; background: var(--glass); border: 1px solid var(--stroke); border-radius: 16px;
  padding: 8px 14px; text-align: center; backdrop-filter: blur(14px); position: relative; overflow: hidden;
  transition: transform .25s cubic-bezier(.34,1.56,.64,1), border-color .3s;
}
.stat::after { content: ''; position: absolute; inset: 0; background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,.08) 50%, transparent 70%);
  transform: translateX(-120%); transition: transform .6s; }
.stat.bump { transform: translateY(-3px) scale(1.04); border-color: var(--stroke2); }
.stat.bump::after { transform: translateX(120%); }
.stat label { display: block; font-size: 10px; letter-spacing: 2px; color: var(--dim); margin-bottom: 2px; }
.stat b { font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums;
  background: linear-gradient(180deg, #fff, #b9c1e6); -webkit-background-clip: text; background-clip: text; color: transparent; }
.stat.par b { color: var(--amber); -webkit-text-fill-color: var(--amber); }
.stat.best b { color: var(--cyan); -webkit-text-fill-color: var(--cyan); }
.stat.undo b { color: var(--violet); -webkit-text-fill-color: var(--violet); }
.stat.undo.empty b { color: var(--rose); -webkit-text-fill-color: var(--rose); }

/* ---------- stage ---------- */
.stage-wrap { position: relative; margin: 10px 8px 4px; }
.stage-frame {
  position: relative; padding: 10px; border-radius: 22px;
  background: linear-gradient(160deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
  border: 1px solid var(--stroke); backdrop-filter: blur(10px);
  box-shadow: 0 24px 70px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.3), 0 0 60px rgba(83,216,255,.05);
}
.stage-frame::before { content: ''; position: absolute; inset: -1px; border-radius: 23px; padding: 1px; pointer-events: none;
  background: linear-gradient(140deg, rgba(255,180,84,.35), transparent 30%, transparent 70%, rgba(83,216,255,.3));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
canvas#cv { display: block; border-radius: 14px; max-width: calc(100vw - 52px); height: auto; }
.overlay {
  position: fixed; inset: 0; z-index: 50; border-radius: 0;
  background: rgba(8,11,22,.78); backdrop-filter: blur(12px);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  opacity: 0; pointer-events: none; transition: opacity .45s, transform .45s; transform: scale(1.04);
}
.overlay.show { opacity: 1; pointer-events: auto; transform: scale(1); }
#fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; }
.win-card {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 16px;
  background: linear-gradient(165deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
  border: 1px solid var(--stroke); border-radius: 26px;
  padding: clamp(24px, 5vw, 34px) clamp(24px, 7vw, 48px) clamp(20px, 4vw, 28px);
  min-width: min(320px, calc(100vw - 44px));
  box-shadow: 0 30px 90px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.12);
}
.overlay h2 { margin: -4px 0 0; font-size: 27px; font-weight: 900; letter-spacing: 3px;
  background: linear-gradient(90deg, var(--ok), var(--cyan)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.overlay .stars { display: flex; gap: 10px; }
.overlay .stars span { font-size: 32px; line-height: 1; color: #ffd166; opacity: 0; animation: starPop .5s cubic-bezier(.34,2,.6,1) both; text-shadow: 0 0 18px rgba(255,209,102,.45); }
.overlay .stars span:nth-child(2) { animation-delay: .18s; } .overlay .stars span:nth-child(3) { animation-delay: .36s; }
@keyframes starPop { 0% { opacity: 0; transform: scale(0) rotate(120deg); } 100% { opacity: 1; transform: scale(1) rotate(0); } }
.overlay .stars span.dim { filter: grayscale(1) brightness(.45); text-shadow: none; }
.win-stats { display: flex; gap: 10px; }
.ws {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  min-width: 96px; padding: 9px 16px 8px; border-radius: 14px;
  background: rgba(255,255,255,.05); border: 1px solid var(--stroke);
}
.ws label { font-size: 9px; letter-spacing: 2px; color: var(--dim); }
.ws b { font-size: 21px; font-weight: 800; font-variant-numeric: tabular-nums; }
#winNote { margin: 0; color: var(--muted); font-size: 13px; letter-spacing: .5px; text-align: center; }
.win-btns { display: flex; gap: 10px; margin-top: 4px; }

/* ---------- controls ---------- */
.controls { display: flex; gap: 10px; padding: 12px 10px 4px; flex-wrap: wrap; justify-content: center; }
.btn {
  position: relative; overflow: hidden; cursor: pointer;
  background: var(--glass); border: 1px solid var(--stroke); color: var(--text);
  border-radius: 14px; padding: 11px 18px; font-size: 14px; font-weight: 600;
  backdrop-filter: blur(14px); transition: transform .18s cubic-bezier(.34,1.56,.64,1), border-color .25s, box-shadow .25s, background .25s;
}
.btn:hover { border-color: var(--stroke2); background: var(--glass2); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.35); }
.btn:active { transform: translateY(0) scale(.96); }
.btn .kbd { font-size: 10px; color: var(--dim); margin-left: 6px; border: 1px solid var(--stroke); border-radius: 5px; padding: 1px 5px; }
.btn.primary {
  background: linear-gradient(135deg, var(--amber), var(--amber2)); border: none; color: #2a1500; font-weight: 800;
  box-shadow: 0 6px 26px rgba(255,141,58,.4), inset 0 1px 0 rgba(255,255,255,.35);
}
.btn.primary:hover { box-shadow: 0 10px 34px rgba(255,141,58,.6), inset 0 1px 0 rgba(255,255,255,.35); transform: translateY(-2px); }
.btn.ripple::after { content: ''; position: absolute; inset: 0; border-radius: inherit;
  background: radial-gradient(circle at var(--rx,50%) var(--ry,50%), rgba(255,255,255,.25), transparent 55%);
  transform: scale(0); opacity: 0; }
.btn.ripple.pressing::after { animation: rip .5s ease-out; }
@keyframes rip { 0% { transform: scale(0); opacity: 1; } 100% { transform: scale(1.6); opacity: 0; } }
.btn:disabled, .btn:disabled:hover {
  opacity: .32; cursor: not-allowed; transform: none;
  box-shadow: none; border-color: var(--stroke); background: var(--glass);
}

.dpad { display: grid; grid-template-columns: repeat(3, 58px); grid-auto-rows: 58px; gap: 8px; margin: 10px 0 6px; }
.dpad button {
  font-size: 21px; border-radius: 17px; position: relative;
  background: var(--glass); border: 1px solid var(--stroke); color: var(--text); cursor: pointer;
  backdrop-filter: blur(14px); transition: all .16s cubic-bezier(.34,1.56,.64,1);
  box-shadow: 0 4px 16px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.08);
}
.dpad button:hover { background: var(--glass2); border-color: var(--stroke2); transform: translateY(-2px); }
.dpad button:active { transform: scale(.9); background: rgba(255,180,84,.2); border-color: var(--amber); }
.dpad .blank { visibility: hidden; }
.dpad-hint { font-size: 11px; color: var(--dim); letter-spacing: 1px; margin-bottom: 12px; }
footer { padding: 10px; font-size: 11px; color: var(--dim); text-align: center; letter-spacing: .5px; }
footer a { color: var(--muted); text-decoration: none; font-weight: 600; transition: color .25s; }
footer a:hover { color: var(--amber); }
footer .brand-mark { color: var(--amber); font-weight: 800; letter-spacing: 1px; }

/* ---------- dialog ---------- */
dialog {
  background: linear-gradient(165deg, #1c2240, #141830); color: var(--text);
  border: 1px solid var(--stroke2); border-radius: 24px; padding: 22px;
  max-width: min(94vw, 620px); width: 100%; max-height: 84dvh;
  box-shadow: 0 40px 120px rgba(0,0,0,.7); opacity: 0; transform: translateY(24px) scale(.96);
  transition: opacity .35s, transform .35s cubic-bezier(.2,1.4,.4,1);
}
dialog[open] { opacity: 1; transform: translateY(0) scale(1); }
dialog::backdrop { background: rgba(6,8,18,.72); backdrop-filter: blur(8px); }
dialog h3 { font-size: 19px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
dialog .sub { color: var(--dim); font-size: 12px; margin-bottom: 14px; }
.tier { margin: 12px 0; }
.tier .tname { font-size: 12px; font-weight: 700; letter-spacing: 1px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.tier .tname::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--stroke), transparent); }
.tier:nth-child(2) .tname { color: var(--ok); } .tier:nth-child(3) .tname { color: var(--cyan); }
.tier:nth-child(4) .tname { color: var(--violet); } .tier:nth-child(5) .tname { color: var(--amber); }
.tier:nth-child(6) .tname { color: var(--rose); } .tier:nth-child(7) .tname { color: #ff5c5c; }
.cells { display: flex; flex-wrap: wrap; gap: 8px; }
.lv {
  width: 54px; height: 58px; border-radius: 14px; cursor: pointer; position: relative; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  background: var(--glass); border: 1px solid var(--stroke); font-size: 16px; font-weight: 700;
  transition: all .18s cubic-bezier(.34,1.56,.64,1);
}
.lv:hover { transform: translateY(-3px) scale(1.05); border-color: var(--stroke2); background: var(--glass2); box-shadow: 0 8px 22px rgba(0,0,0,.4); }
.lv small { font-size: 9px; color: var(--ok); font-weight: 600; }
.lv.locked { opacity: .32; cursor: not-allowed; filter: grayscale(.6); }
.lv.locked:hover { transform: none; box-shadow: none; }
.lv.current { border-color: var(--amber); box-shadow: 0 0 0 2px rgba(255,180,84,.3), 0 0 24px rgba(255,180,84,.25); }
.lv.current::after { content: '▶'; position: absolute; top: 4px; right: 6px; font-size: 8px; color: var(--amber); animation: pulse 1.5s infinite; }
.lv .lock { font-size: 13px; }

#toast {
  position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(16px);
  background: rgba(28,34,64,.92); border: 1px solid var(--stroke2); color: var(--text);
  padding: 10px 20px; border-radius: 999px; font-size: 13px; z-index: 99;
  backdrop-filter: blur(12px); box-shadow: 0 12px 40px rgba(0,0,0,.5);
  opacity: 0; transition: opacity .3s, transform .3s cubic-bezier(.34,1.56,.64,1); pointer-events: none;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
@media (max-width: 560px) {
  header { padding: 14px 14px 6px; } .logo h1 { font-size: 18px; }
  .hud { gap: 7px; padding: 10px 10px 4px; } .stat { min-width: 80px; padding: 7px 10px; } .stat b { font-size: 16px; }
  .dpad { grid-template-columns: repeat(3, 54px); grid-auto-rows: 54px; }
}
</style>
</head>
<body>
<div class="ambient"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>
<div class="gridlines"></div>
<main>
<header>
  <div class="logo">
    <div class="logo-mark"></div>
    <div><h1>推箱子</h1><small>SOKOBAN · DELUXE</small></div>
  </div>
  <div class="head-right">
    <span class="chip" id="lvBadge">关卡 1 / 57</span>
    <span class="chip" id="syncBadge"><span class="dot"></span>同步</span>
  </div>
</header>

<div class="hud">
  <div class="stat" id="stMoves"><label>步数 MOVES</label><b>0</b></div>
  <div class="stat" id="stPushes"><label>推数 PUSHES</label><b>0</b></div>
  <div class="stat par" id="stPar"><label>目标 PAR</label><b>-</b></div>
  <div class="stat best" id="stBest"><label>最佳 BEST</label><b>-</b></div>
  <div class="stat undo" id="stUndo"><label>撤销 UNDO</label><b>-</b></div>
</div>

<div class="stage-wrap">
  <div class="stage-frame">
    <canvas id="cv" width="480" height="360"></canvas>
  </div>
</div>

<div class="overlay" id="winOverlay">
  <canvas id="fx"></canvas>
  <div class="win-card">
    <div class="stars"><span>★</span><span>★</span><span>★</span></div>
    <h2 id="winTitle">完美通关</h2>
    <div class="win-stats">
      <div class="ws"><label>步数 MOVES</label><b id="wMoves">-</b></div>
      <div class="ws"><label>推动 PUSHES</label><b id="wPushes">-</b></div>
    </div>
    <p id="winNote"></p>
    <div class="win-btns">
      <button class="btn ripple" id="btnReplay">↻ 重玩本关</button>
      <button class="btn primary" id="btnNext">下一关 →</button>
    </div>
  </div>
</div>

<div class="controls">
  <button class="btn ripple" id="btnUndo">↶ 撤销<span class="kbd">U</span></button>
  <button class="btn ripple" id="btnRestart">↻ 重来<span class="kbd">R</span></button>
  <button class="btn ripple" id="btnPrev">← 上一关</button>
  <button class="btn ripple" id="btnLevels">☰ 选关</button>
  <button class="btn ripple" id="btnMute">🔊 音效</button>
</div>

<div class="dpad">
  <button class="blank">·</button><button data-dir="up" class="ripple">▲</button><button class="blank">·</button>
  <button data-dir="left" class="ripple">◀</button><button data-dir="down" class="ripple">▼</button><button data-dir="right" class="ripple">▶</button>
</div>
<div class="dpad-hint">方向键 / WASD 移动 · 触屏滑动同样有效</div>
<footer>玩家 <b id="pid"></b> · 进度自动云端同步 · 离线可玩<br>
<a href="https://www.haoaiganfan.top" target="_blank" rel="noopener"><span class="brand-mark">zhaojiu</span> 出品</a></footer>
</main>
<div id="toast"></div>

<dialog id="lvDialog">
  <h3>选择关卡 <span style="font-size:12px;color:var(--dim);font-weight:400" id="dlgProg"></span></h3>
  <div class="sub">通关解锁下一关 · 卡片下方显示历史最佳步数</div>
  <div id="tierBox" style="overflow-y:auto; max-height: 56dvh;"></div>
  <div style="text-align:right;margin-top:14px"><button class="btn ripple" id="btnCloseDlg">关闭</button></div>
</dialog>

/* ============ storage & sync (unchanged logic) ============ */
const store = {
  pid: localStorage.getItem('sk_pid') || ('P' + Math.random().toString(36).slice(2, 10)),
  get() { try { return JSON.parse(localStorage.getItem('sk_progress') || '{}'); } catch (e) { return {}; } },
  set(d) { localStorage.setItem('sk_progress', JSON.stringify(d)); },
  get unlocked() { return this.get().unlocked || 1; },
  get best() { return this.get().best || {}; },
  setBest(lv, m) {
    const d = this.get(); d.best = d.best || {};
    if (!d.best[lv] || m < d.best[lv]) { d.best[lv] = m; this.set(d); syncPush(d); }
  },
  unlock(lv) {
    const d = this.get();
    if (lv > (d.unlocked || 1)) { d.unlocked = lv; this.set(d); syncPush(d); }
  }
};
localStorage.setItem('sk_pid', store.pid);
$('pid').textContent = store.pid;

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm = setTimeout(() => t.classList.remove('show'), 1700);
}
let syncing = false;
async function syncPull() {
  try {
    const r = await fetch('/api/progress?player=' + encodeURIComponent(store.pid));
    if (!r.ok) throw 0;
    const j = await r.json();
    const d = store.get(); let changed = false;
    if ((j.unlocked || 1) > (d.unlocked || 1)) { d.unlocked = j.unlocked; changed = true; }
    d.best = d.best || {};
    for (const k in (j.best || {}))
      if (!d.best[k] || j.best[k] < d.best[k]) { d.best[k] = j.best[k]; changed = true; }
    if (changed) store.set(d);
    setSync(true);
  } catch (e) { setSync(false); }
}
async function syncPush(d) {
  if (syncing) return; syncing = true;
  try {
    const r = await fetch('/api/progress', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ player: store.pid, unlocked: d.unlocked || 1, best: d.best || {} })
    });
    setSync(r.ok);
  } catch (e) { setSync(false); }
  syncing = false;
}
function setSync(ok) {
  const b = $('syncBadge');
  b.classList.toggle('off', !ok);
  b.innerHTML = '<span class="dot"></span>' + (ok ? '已同步' : '离线');
}

/* ============ audio synth ============ */
let AC = null, muted = localStorage.getItem('sk_mute') === '1';
function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } return AC; }
function tone(freq, dur, type, vol, slide) {
  if (muted) return; const a = ac(); if (!a) return;
  if (a.state === 'suspended') a.resume();
  const t = a.currentTime, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .02);
}
const sfx = {
  move:  () => tone(340, .05, 'sine', .05, 300),
  push:  () => { tone(140, .12, 'triangle', .18, 90); tone(70, .1, 'sine', .14); },
  goal:  () => { tone(660, .12, 'sine', .12); setTimeout(() => tone(880, .16, 'sine', .12), 90); },
  undo:  () => tone(280, .08, 'sine', .07, 200),
  win:   () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, .3, 'triangle', .14), i * 110)),
  deny:  () => tone(110, .08, 'square', .05, 90),
};
function updateMuteBtn() { $('btnMute').innerHTML = (muted ? '🔇' : '🔊') + ' 音效'; }

updateMuteBtn();

/* ============ animation engine ============ */
const anim = { boxes: new Map(), px: 0, py: 0, pt: 0, squash: 0, particles: [], shake: 0, t: 0 };
function ease(x) { return 1 - Math.pow(1 - x, 3); }
function boxAnim(key) {
  if (!anim.boxes.has(key)) {
    const [r, c] = key.split(',').map(Number);
    anim.boxes.set(key, { x: c, y: r, spawn: 1, pop: 0 });
  }
  return anim.boxes.get(key);
}
function spawnParticles(px, py, color, n, spread) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = (0.4 + Math.random()) * spread;
    anim.particles.push({ x: px, y: py, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - spread * .6,
      life: 1, size: 2 + Math.random() * 3, color, g: .12 });
  }
}
function confettiBurst() {
  sizeFx();
  const W = fx.width, H = fx.height;
  const colors = ['#ffb454', '#53d8ff', '#4ade9b', '#a78bfa', '#ff6b8a', '#fff'];
  for (let i = 0; i < 130; i++) {
    anim.particles.push({
      x: W / 2 + (Math.random() - .5) * W * .6, y: H * .55,
      vx: (Math.random() - .5) * 14, vy: -5 - Math.random() * 10,
      life: 1, size: 3 + Math.random() * 4, color: colors[i % colors.length],
      g: .16, spin: Math.random() * Math.PI, sq: Math.random() < .5, conf: true
    });
  }
}
function stepParticles() {
  for (let i = anim.particles.length - 1; i >= 0; i--) {
    const p = anim.particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= .99; p.life -= .012;
    if (p.conf && p.sq) p.spin += .15;
    if (p.life <= 0 || p.y > (p.conf ? fx.height : cv.height) + 20) anim.particles.splice(i, 1);
  }
}
function drawParticles() {
  for (const p of anim.particles) {
    const c = p.conf ? fctx : ctx;
    c.globalAlpha = Math.max(0, p.life);
    c.fillStyle = p.color;
    if (p.conf && p.sq) {
      c.save(); c.translate(p.x, p.y); c.rotate(p.spin);
      c.fillRect(-p.size, -p.size * .55, p.size * 2, p.size * 1.1); c.restore();
    } else {
      c.beginPath(); c.arc(p.x, p.y, p.size * p.life, 0, 7); c.fill();
    }
  }
  ctx.globalAlpha = 1; fctx.globalAlpha = 1;
}

/* ============ level ============ */
function loadLevel(i, animateIn) {
  cur = ((i - 1) + LEVELS.length) % LEVELS.length;
  const lv = LEVELS[cur];
  grid = lv.grid.map(r => r.split(''));
  const H = grid.length, W = Math.max(...grid.map(r => r.length));
  grid = grid.map(r => { while (r.length < W) r.push('#'); return r; });
  goals = new Set(); boxes = new Set();
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
    const ch = grid[r][c];
    if (ch === '.') { goals.add(r + ',' + c); grid[r][c] = ' '; }
    else if (ch === '$') { boxes.add(r + ',' + c); grid[r][c] = ' '; }
    else if (ch === '*') { goals.add(r + ',' + c); boxes.add(r + ',' + c); grid[r][c] = ' '; }
    else if (ch === '@') { player = { r, c }; grid[r][c] = ' '; }
    else if (ch === '+') { goals.add(r + ',' + c); player = { r, c }; grid[r][c] = ' '; }
  }
  history = []; moves = 0; pushes = 0; won = false;
  undoLeft = undoQuotaFor(lv);
  anim.boxes.clear(); anim.particles.length = 0;
  anim.px = player.c; anim.py = player.r;
  for (const b of boxes) boxAnim(b);
  if (animateIn) for (const a of anim.boxes.values()) { a.spawn = 0; }
  $('winOverlay').classList.remove('show');
  fctx.clearRect(0, 0, fx.width, fx.height);
  $('lvBadge').textContent = `关卡 ${cur + 1} / ${LEVELS.length}`;
  setStat('stPar', lv.pushes); $('stBest').querySelector('b').textContent = store.best[cur + 1] ?? '—';
  setStat('stMoves', 0); setStat('stPushes', 0);
  updateUndoUI();
  resize();
}
function setStat(id, v) {
  const el = $(id), b = el.querySelector('b');
  if (b.textContent !== String(v)) {
    b.textContent = v;
    el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
    setTimeout(() => el.classList.remove('bump'), 350);
  }
}

function move(dr, dc) {
  if (won) return;
  const nr = player.r + dr, nc = player.c + dc, key = nr + ',' + nc;
  if (grid[nr][nc] === '#') { anim.shake = Math.min(anim.shake + 3, 5); sfx.deny(); return; }
  if (boxes.has(key)) {
    const br = nr + dr, bc = nc + dc, bkey = br + ',' + bc;
    if (grid[br][bc] === '#' || boxes.has(bkey)) { anim.shake = Math.min(anim.shake + 3, 5); sfx.deny(); return; }
    const a = anim.boxes.get(key) || boxAnim(key);
    anim.boxes.delete(key); anim.boxes.set(bkey, a);
    boxes.delete(key); boxes.add(bkey);
    history.push({ pr: player.r, pc: player.c, box: [nr, nc, br, bc] });
    player = { r: nr, c: nc };
    pushes++; moves++;
    anim.squash = 1;
    sfx.push();
    const landed = goals.has(bkey), leftGoal = goals.has(key);
    if (landed) {
      a.pop = 1; sfx.goal();
      setTimeout(() => spawnParticles((bc + .5) * cell, (br + .5) * cell, '#4ade9b', 26, 3.2), 110);
      anim.shake = Math.max(anim.shake, 2.5);
    } else if (leftGoal) {
      spawnParticles((bc + .5) * cell, (br + .5) * cell, '#616a8f', 8, 1.6);
    }
    if ([...boxes].every(b => goals.has(b))) setTimeout(win, 380);
  } else {
    history.push({ pr: player.r, pc: player.c });
    player = { r: nr, c: nc };
    moves++;
    sfx.move();
  }
  setStat('stMoves', moves); setStat('stPushes', pushes);
}

function undo() {
  if (!history.length) return;
  if (undoLeft <= 0) { toast('撤销次数已用完'); sfx.deny(); return; }
  const h = history.pop();
  undoLeft--;
  updateUndoUI();
  if (undoLeft === 0) toast('撤销次数已用完');
  if (h.box) {
    const [fr, fc, tr, tc] = h.box;
    const fk = fr + ',' + fc, tk = tr + ',' + tc;
    const a = anim.boxes.get(tk) || boxAnim(tk);
    anim.boxes.delete(tk); anim.boxes.set(fk, a);
    boxes.delete(tk); boxes.add(fk);
    pushes--;
  }
  player = { r: h.pr, c: h.pc };
  moves--;
  sfx.undo();
  setStat('stMoves', moves); setStat('stPushes', pushes);
  $('winOverlay').classList.remove('show'); won = false;
  fctx.clearRect(0, 0, fx.width, fx.height);
}

function win() {
  won = true;
  store.setBest(cur + 1, moves);
  store.unlock(cur + 2);
  const lv = LEVELS[cur];
  const stars = pushes <= lv.pushes ? 3 : pushes <= lv.pushes * 1.5 ? 2 : 1;
  const starEls = $('winOverlay').querySelectorAll('.stars span');
  starEls.forEach((s, i) => s.classList.toggle('dim', i >= stars));
  const hasNext = cur + 1 < LEVELS.length;
  $('winTitle').textContent = stars === 3 ? '完美通关' : stars === 2 ? '顺利通关' : '通关';
  $('wMoves').textContent = moves;
  $('wPushes').textContent = `${pushes}/${lv.pushes}`;
  $('winNote').textContent = hasNext ? `已解锁第 ${cur + 2} 关` : '🏆 全部通关，你就是推箱子大师！';
  $('btnNext').style.display = hasNext ? '' : 'none';
  $('btnReplay').style.display = hasNext ? 'none' : '';
  $('winOverlay').classList.add('show');
  confettiBurst(); sfx.win();
  anim.shake = 4;
}

function resize() {
  const H = grid.length, W = grid[0].length;
  const availW = Math.min(window.innerWidth - 68, 780);
  const availH = Math.max(window.innerHeight - 390, 170);
  cell = Math.max(16, Math.min(44, Math.floor(Math.min(availW / W, availH / H))));
  const dpr = window.devicePixelRatio || 1;
  cv.width = W * cell * dpr; cv.height = H * cell * dpr;
  cv.style.width = W * cell + 'px'; cv.style.height = H * cell + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);

function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function draw() {
  anim.t += 1;
  requestAnimationFrame(draw);
  if (!grid) return;
  const H = grid.length, W = grid[0].length;
  const vw = W * cell, vh = H * cell, t = anim.t;
  // shake decay
  let ox = 0, oy = 0;
  if (anim.shake > .1) {
    ox = (Math.random() - .5) * anim.shake; oy = (Math.random() - .5) * anim.shake;
    anim.shake *= .85;
  }
  ctx.save();
  ctx.clearRect(0, 0, vw, vh);
  ctx.translate(ox, oy);
  // floor
  const fg = ctx.createLinearGradient(0, 0, 0, vh);
  fg.addColorStop(0, '#232948'); fg.addColorStop(1, '#1c2140');
  ctx.fillStyle = fg; ctx.fillRect(-4, -4, vw + 8, vh + 8);
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
    if ((r + c) % 2 === 0) { ctx.fillStyle = 'rgba(255,255,255,.018)'; ctx.fillRect(c * cell, r * cell, cell, cell); }
  }
  // vignette
  const vg = ctx.createRadialGradient(vw / 2, vh / 2, Math.min(vw, vh) * .3, vw / 2, vh / 2, Math.max(vw, vh) * .75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.4)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, vw, vh);

  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
    const x = c * cell, y = r * cell;
    if (grid[r][c] === '#') {
      const up = r > 0 && grid[r - 1][c] !== '#';
      ctx.fillStyle = '#3b415f';
      rrect(x + 1, y + 1, cell - 2, cell - 2, cell * .18); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.07)';
      if (up) ctx.fillRect(x + 3, y + 2, cell - 6, Math.max(2, cell * .1));
      ctx.fillStyle = 'rgba(0,0,0,.22)';
      ctx.fillRect(x + 3, y + cell - 4 - cell * .06, cell - 6, Math.max(2, cell * .08));
      continue;
    }
    const k = r + ',' + c;
    if (goals.has(k)) {
      const pulse = .5 + .5 * Math.sin(t * .06 + (r * 7 + c * 13) * .5);
      const cx0 = x + cell / 2, cy0 = y + cell / 2;
      ctx.save();
      ctx.translate(cx0, cy0); ctx.rotate(Math.PI / 4 + t * .008);
      const s = cell * (0.13 + .035 * pulse);
      ctx.shadowColor = '#ffb454'; ctx.shadowBlur = 10 + 8 * pulse;
      ctx.fillStyle = `rgba(255,180,84,${.55 + .35 * pulse})`;
      rrect(-s, -s, s * 2, s * 2, s * .3); ctx.fill();
      ctx.restore();
    }
  }

  // boxes
  for (const [k, a] of anim.boxes) {
    const tx = +k.split(',')[1], ty = +k.split(',')[0];
    a.x += (tx - a.x) * .32; a.y += (ty - a.y) * .32;
    if (a.spawn < 1) a.spawn = Math.min(1, a.spawn + .09);
    if (a.pop > 0) a.pop *= .86;
    const on = goals.has(k);
    const sc = ease(a.spawn) * (1 + a.pop * .22);
    const cx0 = (a.x + .5) * cell, cy0 = (a.y + .5) * cell;
    const s = cell * .38 * sc;
    ctx.save();
    ctx.translate(cx0, cy0);
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.ellipse(0, s * .82, s * .85, s * .3, 0, 0, 7); ctx.fill();
    if (on) { ctx.shadowColor = '#4ade9b'; ctx.shadowBlur = 16 + 5 * Math.sin(t * .1); }
    const bg = ctx.createLinearGradient(-s, -s, s, s);
    if (on) { bg.addColorStop(0, '#7ce8b4'); bg.addColorStop(1, '#2f9e6c'); }
    else { bg.addColorStop(0, '#c98d4b'); bg.addColorStop(1, '#8a5a28'); }
    ctx.fillStyle = bg;
    rrect(-s, -s, s * 2, s * 2, s * .3); ctx.fill();
    ctx.shadowBlur = 0;
    // crate detailing
    ctx.strokeStyle = on ? 'rgba(20,80,50,.6)' : 'rgba(60,35,10,.65)';
    ctx.lineWidth = Math.max(1.5, s * .12);
    rrect(-s * .62, -s * .62, s * 1.24, s * 1.24, s * .16); ctx.stroke();
    ctx.strokeStyle = on ? 'rgba(255,255,255,.3)' : 'rgba(255,220,160,.28)';
    ctx.lineWidth = 1.2;
    rrect(-s + 3, -s + 3, s * 2 - 6, s * 2 - 6, s * .22); ctx.stroke();
    if (on) {
      ctx.fillStyle = '#eafff4'; ctx.font = `bold ${s * .9}px sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('✓', 0, s * .06);
    }
    ctx.restore();
  }

  // player
  const pa = anim;
  pa.px += (player.c - pa.px) * .34; pa.py += (player.r - pa.py) * .34;
  if (pa.squash > .01) pa.squash *= .86; else pa.squash = 0;
  const bob = Math.sin(t * .09) * cell * .02;
  const sq = pa.squash;
  const pcx = (pa.px + .5) * cell, pcy = (pa.py + .5) * cell + bob;
  const prad = cell * .33 * (1 - sq * .15);
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.38)';
  ctx.beginPath(); ctx.ellipse(pcx, pcy + prad * .8, prad * .85, prad * .32, 0, 0, 7); ctx.fill();
  ctx.shadowColor = '#53d8ff'; ctx.shadowBlur = 14;
  const pg = ctx.createRadialGradient(pcx - prad * .35, pcy - prad * .45, prad * .2, pcx, pcy, prad * 1.15);
  pg.addColorStop(0, '#bdeeff'); pg.addColorStop(.55, '#53d8ff'); pg.addColorStop(1, '#1f7fd6');
  ctx.fillStyle = pg;
  ctx.beginPath(); ctx.ellipse(pcx, pcy, prad * (1 + sq * .18), prad * (1 - sq * .14), 0, 0, 7); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(10,25,50,.9)';
  const eo = prad * .16, ey = pcy - prad * .12;
  ctx.beginPath(); ctx.arc(pcx - eo, ey, prad * .1, 0, 7); ctx.arc(pcx + eo, ey, prad * .1, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.beginPath(); ctx.arc(pcx - eo - prad * .03, ey - prad * .03, prad * .035, 0, 7); ctx.arc(pcx + eo - prad * .03, ey - prad * .03, prad * .035, 0, 7); ctx.fill();
  ctx.restore();

  stepParticles();
  drawParticles();
  ctx.restore();
}
requestAnimationFrame(draw);

/* ============ level dialog ============ */
function buildDialog() {
  const box = $('tierBox');
  box.innerHTML = '';
  const cleared = Object.keys(store.best).length;
  $('dlgProg').textContent = `${cleared}/${LEVELS.length} 已通关`;
  for (const tr of TIERS) {
    const div = document.createElement('div');
    div.className = 'tier';
    const nm = document.createElement('div');
    nm.className = 'tname'; nm.textContent = tr.name;
    div.appendChild(nm);
    const cells = document.createElement('div');
    cells.className = 'cells';
    for (let i = tr.from; i <= Math.min(tr.to, LEVELS.length); i++) {
      const b = document.createElement('div');
      const locked = i > store.unlocked;
      b.className = 'lv' + (locked ? ' locked' : '') + (i === cur + 1 ? ' current' : '');
      b.innerHTML = locked ? `<span class="lock">🔒</span>` :
        `${i}` + (store.best[i] ? `<small>${store.best[i]}步</small>` : '');
      b.onclick = () => {
        if (locked) { toast('先通过前面的关卡解锁'); return; }
        $('lvDialog').close();
        loadLevel(i, true);
      };
      cells.appendChild(b);
    }
    div.appendChild(cells);
    box.appendChild(div);
  }
}

/* ============ input ============ */
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  const map = { arrowup: [-1, 0], w: [-1, 0], arrowdown: [1, 0], s: [1, 0],
                arrowleft: [0, -1], a: [0, -1], arrowright: [0, 1], d: [0, 1] };
  if (map[k]) { e.preventDefault(); move(...map[k]); }
  else if (k === 'u') undo();
  else if (k === 'r') loadLevel(cur + 1, true);
  else if (k === 'n' && won) loadLevel(cur + 2, true);
});
document.querySelectorAll('.dpad button[data-dir]').forEach(b => {
  const dirs = { up: [-1, 0], down: [1, 0], left: [0, -1], right: [0, 1] };
  b.addEventListener('click', () => move(...dirs[b.dataset.dir]));
});
let tsx = 0, tsy = 0;
cv.addEventListener('touchstart', e => { tsx = e.touches[0].clientX; tsy = e.touches[0].clientY; }, { passive: true });
cv.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tsx, dy = e.changedTouches[0].clientY - tsy;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
  if (Math.abs(dx) > Math.abs(dy)) move(0, dx > 0 ? 1 : -1);
  else move(dy > 0 ? 1 : -1, 0);
}, { passive: true });

document.querySelectorAll('.ripple').forEach(b => {
  b.addEventListener('pointerdown', e => {
    const r = b.getBoundingClientRect();
    b.style.setProperty('--rx', ((e.clientX - r.left) / r.width * 100) + '%');
    b.style.setProperty('--ry', ((e.clientY - r.top) / r.height * 100) + '%');
    b.classList.remove('pressing'); void b.offsetWidth; b.classList.add('pressing');
  });
});

$('btnUndo').onclick = undo;
$('btnRestart').onclick = () => loadLevel(cur + 1, true);
$('btnPrev').onclick = () => loadLevel(cur, true);
$('btnNext').onclick = () => loadLevel(cur + 2, true);
$('btnReplay').onclick = () => loadLevel(cur + 1, true);
$('btnLevels').onclick = () => { buildDialog(); $('lvDialog').showModal(); };
$('btnCloseDlg').onclick = () => $('lvDialog').close();

loadLevel(Math.min(store.unlocked, LEVELS.length), true);
</script>
</body>
</html>
