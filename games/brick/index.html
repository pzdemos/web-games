<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>打砖块 · 小游戏</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230d0a08'/%3E%3Crect x='14' y='20' width='18' height='10' rx='2' fill='%23f59e0b'/%3E%3Crect x='36' y='20' width='18' height='10' rx='2' fill='%23ef4444'/%3E%3Crect x='58' y='20' width='18' height='10' rx='2' fill='%23fbbf24'/%3E%3Crect x='28' y='36' width='34' height='8' rx='4' fill='%23f97316'/%3E%3Ccircle cx='45' cy='68' r='6' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div class="top">
    <div class="title">打砖块</div>
    <div class="scores">
      <div class="sc"><div class="l">Score</div><div class="v" id="score">0</div></div>
      <div class="sc"><div class="l">Level</div><div class="v" id="level">1</div></div>
      <div class="sc"><div class="l">Lives</div><div class="v lives" id="lives">3</div></div>
      <button class="gapi-chip" id="userChip" title="账号"></button>
      <button class="gapi-lb" id="lbBtn" title="云端排行榜">🏆</button>
    </div>
  </div>

  <div class="wrap">
    <canvas id="game"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">打砖块</h2>
      <p id="ovText">移动挡板接住小球 · 击碎全部砖块过关</p>
      <button class="primary" id="ovBtn">开始游戏</button>
    </div>
  </div>

  <div class="hint">
    <kbd>←→</kbd> / 鼠标 / 触屏 移动挡板 &nbsp; <kbd>空格</kbd> 发射 &nbsp; <kbd>P</kbd> 暂停 &nbsp; <kbd>R</kbd> 重开<br>
    击碎全部砖块进入下一关 · 球落地损失一条命 · 挡板击球位置决定反弹角度
  </div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
